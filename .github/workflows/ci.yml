name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Sync pinned alpha profiles
        run: npm run setup:alpha
      - run: npm run check
      - name: Focused test - internal residual rescue
        run: node --test tests/internalResidualRescue.test.mjs
      - name: Focused test - structured smooth rescue
        run: node --test tests/structuredSmoothRescue.test.mjs
      - name: Focused test - batch preview model
        run: node --test tests/batchPreviewModel.test.mjs
      - name: Legacy tests A-M
        run: node --test tests/[a-m]*.test.mjs
      - name: Legacy tests N-Z
        run: node --test tests/[n-zvV]*.test.mjs
      - run: npm test
      - run: npm run build
