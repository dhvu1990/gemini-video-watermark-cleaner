name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  fresh-full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Sync pinned alpha profiles
        run: npm run setup:alpha
      - run: npm run check
      - name: Fresh full suite
        run: npm test

  warmup-af:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Sync pinned alpha profiles
        run: npm run setup:alpha
      - name: Warmup A-F
        run: node --test --test-concurrency=1 tests/[a-f]*.test.mjs
      - name: Full suite after A-F
        run: npm test

  warmup-gm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Sync pinned alpha profiles
        run: npm run setup:alpha
      - name: Warmup G-M
        run: node --test --test-concurrency=1 tests/[g-m]*.test.mjs
      - name: Full suite after G-M
        run: npm test

  warmup-nz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Sync pinned alpha profiles
        run: npm run setup:alpha
      - name: Warmup N-Z
        run: node --test --test-concurrency=1 tests/[n-zvV]*.test.mjs
      - name: Full suite after N-Z
        run: npm test

  warmup-all-groups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Sync pinned alpha profiles
        run: npm run setup:alpha
      - name: Warmup A-F
        run: node --test --test-concurrency=1 tests/[a-f]*.test.mjs
      - name: Warmup G-M
        run: node --test --test-concurrency=1 tests/[g-m]*.test.mjs
      - name: Warmup N-Z
        run: node --test --test-concurrency=1 tests/[n-zvV]*.test.mjs
      - name: Full suite after all warmups
        run: npm test
