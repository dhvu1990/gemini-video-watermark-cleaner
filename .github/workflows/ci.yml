name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Sync pinned alpha profiles
        run: npm run setup:alpha
      - run: npm run check
      - name: Run npm test with concise failure output
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            echo "--- concise npm test failure ---"
            grep -E -B 3 -A 12 'not ok|AssertionError|ERR_ASSERTION|location:|error:' test-output.txt | tail -n 160 || true
            echo "--- final npm test summary ---"
            tail -n 30 test-output.txt
            exit "$code"
          fi
          cat test-output.txt
      - run: npm run build
