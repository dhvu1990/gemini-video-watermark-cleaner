name: Preview GitHub Pages

on:
  push:
    branches: [v1.0.126-post-clean-quality-gate]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production main
        uses: actions/checkout@v7
        with:
          ref: main
          path: production

      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: v1.0.126-post-clean-quality-gate
          path: preview

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build production root
        working-directory: production
        run: |
          npm install --no-audit --no-fund
          npm run setup:alpha
          npm run build

      - name: Build v1.0.126 preview
        working-directory: preview
        run: |
          npm install --no-audit --no-fund
          npm run setup:alpha
          npm run check
          npm test
          npm run build

      - name: Assemble root plus isolated preview
        run: |
          mkdir -p site/preview/v1.0.126
          cp -a production/dist/. site/
          cp -a preview/dist/. site/preview/v1.0.126/
          printf '%s\n' '${{ github.sha }}' > site/preview/v1.0.126/PREVIEW_COMMIT.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy-preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Deploy root plus preview
        id: deployment
        uses: actions/deploy-pages@v5
