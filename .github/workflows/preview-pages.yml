name: Publish Static Preview

on:
  push:
    branches: [v1.0.126-post-clean-quality-gate]

permissions:
  contents: write

concurrency:
  group: preview-v1-0-126
  cancel-in-progress: true

jobs:
  publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v7
        with:
          ref: v1.0.126-post-clean-quality-gate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build and verify v1.0.126
        run: |
          npm install --no-audit --no-fund
          npm run setup:alpha
          npm run check
          npm test
          npm run build

      - name: Publish dist to isolated static branch
        env:
          PREVIEW_BRANCH: preview-v1.0.126-static
        run: |
          set -euo pipefail
          printf '%s\n' '${{ github.sha }}' > dist/PREVIEW_COMMIT.txt
          touch dist/.nojekyll
          tmp_dir="$(mktemp -d)"
          cp -a dist/. "$tmp_dir/"
          git checkout --orphan "$PREVIEW_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          cp -a "$tmp_dir/." ./
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'preview: v1.0.126 static build [skip ci]'
          git push --force origin "$PREVIEW_BRANCH"
